<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed — Aarzoo Electronics</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary:    #0071e3;
      --primary-dk: #0051a2;
      --bg:         #f5f5f7;
      --bg-white:   #ffffff;
      --text:       #1d1d1f;
      --text-muted: #6e6e73;
      --border:     #d2d2d7;
      --green:      #16a34a;
      --green-lt:   #22c55e;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* ── NAV ── */
    nav {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      height: 64px;
    }
    .nav-inner {
      max-width: 1100px; margin: 0 auto;
      padding: 0 24px; height: 100%;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 22px; font-weight: 700;
      color: var(--text); text-decoration: none;
    }
    .logo span { color: var(--primary); }
    .shop-btn {
      background: var(--primary); color: #fff;
      padding: 8px 20px; border-radius: 999px;
      font-size: 14px; font-weight: 600;
      text-decoration: none;
      transition: background .2s;
    }
    .shop-btn:hover { background: var(--primary-dk); }

    /* ── CONFETTI CANVAS ── */
    #confetti-canvas {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 9999;
    }

    /* ── WRAPPER ── */
    .confirm-wrap {
      max-width: 900px; margin: 0 auto;
      padding: 48px 20px 80px;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.4); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes pulse {
      0%,100% { transform: scale(1);   opacity: .4; }
      50%      { transform: scale(1.2); opacity: .1; }
    }

    /* ── SUCCESS HERO ── */
    .success-hero {
      text-align: center; margin-bottom: 36px;
      animation: fadeUp .55s ease both;
    }
    .check-circle {
      width: 90px; height: 90px; border-radius: 50%;
      background: linear-gradient(135deg, var(--green), var(--green-lt));
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; color: #fff;
      margin: 0 auto 20px;
      box-shadow: 0 12px 40px rgba(34,197,94,.35);
      animation: popIn .5s .15s cubic-bezier(.175,.885,.32,1.275) both;
    }
    .success-hero h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 800; letter-spacing: -.02em;
      margin-bottom: 10px; color: var(--text);
    }
    .success-hero p { color: var(--text-muted); font-size: 15px; }
    .order-id-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: #f0fdf4; border: 1px solid #bbf7d0;
      color: #15803d; padding: 8px 20px; border-radius: 100px;
      font-size: 13px; font-weight: 700; margin-top: 14px;
    }

    /* ── DELIVERY BANNER ── */
    .delivery-banner {
      background: linear-gradient(135deg, #0a0a23, #1a237e);
      border-radius: 16px; padding: 20px;
      color: #fff; text-align: center;
      margin-bottom: 28px;
      animation: fadeUp .5s .05s ease both;
    }
    .delivery-banner .label {
      font-size: 11px; opacity: .6; text-transform: uppercase;
      letter-spacing: .1em; margin-bottom: 6px;
    }
    .delivery-banner .dates {
      font-family: 'Syne', sans-serif;
      font-size: 20px; font-weight: 800;
    }
    .delivery-banner .sub { font-size: 12px; opacity: .55; margin-top: 4px; }

    /* ── MAIN GRID ── */
    .confirm-grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 22px; align-items: start;
    }
    @media (max-width: 750px) {
      .confirm-grid { grid-template-columns: 1fr; }
      .right-col { order: -1; }
    }

    .left-col { display: flex; flex-direction: column; gap: 20px; }
    .right-col { display: flex; flex-direction: column; gap: 18px; }

    /* ── CARDS ── */
    .card {
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: 18px; overflow: hidden;
      animation: fadeUp .5s ease both;
    }
    .card:nth-child(1) { animation-delay: .1s; }
    .card:nth-child(2) { animation-delay: .2s; }
    .card:nth-child(3) { animation-delay: .25s; }
    .card:nth-child(4) { animation-delay: .3s; }

    .card-head {
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .card-head-icon {
      width: 34px; height: 34px; border-radius: 10px;
      background: #eff6ff;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
    }
    .card-head h3 {
      font-family: 'Syne', sans-serif;
      font-size: 15px; font-weight: 800; color: var(--text);
    }
    .card-body { padding: 20px 22px; }

    /* ── ORDER ITEMS ── */
    .order-item {
      display: flex; gap: 14px; align-items: center;
      padding: 12px 0; border-bottom: 1px solid var(--border);
    }
    .order-item:last-child { border-bottom: none; padding-bottom: 0; }
    .order-item img {
      width: 56px; height: 56px; object-fit: contain;
      background: #f5f5f7; border-radius: 10px; padding: 6px;
      flex-shrink: 0;
    }
    .order-item-info { flex: 1; min-width: 0; }
    .order-item-name  { font-size: 14px; font-weight: 600; color: var(--text); }
    .order-item-qty   { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .order-item-price { font-size: 14px; font-weight: 700; color: var(--primary); flex-shrink: 0; }

    /* ── TRACKING ── */
    .track-step {
      display: flex; gap: 14px;
      padding-bottom: 24px;
    }
    .track-step:last-child { padding-bottom: 0; }
    .track-left { display: flex; flex-direction: column; align-items: center; }
    .track-dot {
      width: 36px; height: 36px; border-radius: 50%;
      border: 2px solid var(--border); background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0; position: relative; z-index: 1;
    }
    .track-dot.done   { background: var(--green);   border-color: var(--green);   color: #fff; }
    .track-dot.active { background: var(--primary);  border-color: var(--primary); color: #fff;
      box-shadow: 0 0 0 4px rgba(0,113,227,.15); }
    .track-dot.active::after {
      content: ''; position: absolute; inset: -6px; border-radius: 50%;
      border: 2px solid var(--primary); opacity: .4;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .track-line {
      width: 2px; flex: 1; min-height: 18px;
      background: var(--border); margin: 3px auto;
    }
    .track-line.done { background: var(--green); }
    .track-content { padding-top: 4px; flex: 1; }
    .track-content h4 { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .track-content p  { font-size: 12px; color: var(--text-muted); }
    .track-date { font-size: 11px; color: var(--text-muted); font-style: italic; margin-top: 3px; }
    .track-step.done   .track-content h4 { color: #15803d; }
    .track-step.active .track-content h4 { color: var(--primary); }

    /* ── SUMMARY ── */
    .summary-row {
      display: flex; justify-content: space-between;
      font-size: 14px; color: var(--text); margin-bottom: 10px;
    }
    .summary-row.total {
      font-size: 16px; font-weight: 700;
      border-top: 1px solid var(--border);
      padding-top: 10px; margin-top: 4px;
    }
    .pay-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: #eff6ff; border: 1px solid #bfdbfe;
      color: var(--primary); padding: 7px 14px;
      border-radius: 100px; font-size: 13px; font-weight: 600;
      margin-top: 12px;
    }

    /* ── ADDRESS ── */
    .address-box {
      background: var(--bg); border-radius: 12px;
      padding: 14px; font-size: 13px; line-height: 1.8; color: var(--text);
    }
    .address-box strong { display: block; font-weight: 700; margin-bottom: 2px; }

    /* ── BUTTONS ── */
    .btn-primary {
      display: block; width: 100%;
      background: var(--primary); color: #fff;
      padding: 13px; border-radius: 12px;
      font-size: 14px; font-weight: 700;
      text-decoration: none; text-align: center;
      border: none; cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: background .2s;
    }
    .btn-primary:hover { background: var(--primary-dk); }

    .btn-outline {
      display: block; width: 100%;
      background: transparent; color: var(--text);
      padding: 13px; border-radius: 12px;
      font-size: 14px; font-weight: 600;
      text-align: center; border: 1px solid var(--border);
      cursor: pointer; font-family: 'Inter', sans-serif;
      transition: border-color .2s, color .2s;
      margin-top: 10px;
    }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

    /* ── TRUST BADGES ── */
    .trust-row {
      display: flex; gap: 8px; justify-content: center;
      flex-wrap: wrap; margin-top: 36px;
      animation: fadeUp .5s .45s ease both;
    }
    .trust-badge {
      background: var(--bg-white); border: 1px solid var(--border);
      border-radius: 100px; padding: 7px 14px;
      font-size: 12px; font-weight: 500; color: var(--text-muted);
    }

    /* ── NO ORDER ── */
    .no-order {
      text-align: center; padding: 100px 24px;
    }
    .no-order h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2rem; font-weight: 800; margin-bottom: 12px;
    }
    .no-order p { color: var(--text-muted); margin-bottom: 28px; }
    .no-order a {
      display: inline-block;
      background: var(--primary); color: #fff;
      padding: 13px 32px; border-radius: 12px;
      font-weight: 700; text-decoration: none;
      font-size: 15px; transition: background .2s;
    }
    .no-order a:hover { background: var(--primary-dk); }

    /* ── FOOTER ── */
    footer {
      background: #0a0a0a; color: rgba(255,255,255,.6);
      padding: 48px 24px 24px; margin-top: 60px;
    }
    .footer-inner {
      max-width: 1100px; margin: 0 auto;
      display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 40px;
      margin-bottom: 32px;
    }
    @media (max-width: 650px) { .footer-inner { grid-template-columns: 1fr; } }
    .footer-logo {
      font-family: 'Syne', sans-serif;
      font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 8px;
    }
    .footer-logo span { color: var(--primary); }
    .footer-desc { font-size: 13px; line-height: 1.7; }
    .footer-col h4 { color: #fff; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
    .footer-col a {
      display: block; font-size: 13px; color: rgba(255,255,255,.5);
      text-decoration: none; margin-bottom: 8px; transition: color .2s;
    }
    .footer-col a:hover { color: #fff; }
    .footer-bottom {
      max-width: 1100px; margin: 0 auto;
      padding-top: 20px; border-top: 1px solid rgba(255,255,255,.1);
      font-size: 12px; text-align: center;
    }

  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <!-- NAV -->
  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">aar<span>zoo</span></a>
      <a href="products.html" class="shop-btn">🛍️ Continue Shopping</a>
    </div>
  </nav>

  <!-- PAGE CONTENT — injected by JS -->
  <div id="page-content"></div>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <div>
        <div class="footer-logo">aar<span>zoo</span></div>
        <p class="footer-desc">India's trusted destination for premium electronics.</p>
      </div>
      <div class="footer-col">
        <h4>Shop</h4>
        <a href="products.html">All Products</a>
        <a href="products.html?category=smartphones">iPhones</a>
        <a href="products.html?category=wearables">Wearables</a>
      </div>
      <div class="footer-col">
        <h4>Help</h4>
        <a href="#">Contact Us</a>
        <a href="#">Returns Policy</a>
        <a href="#">Warranty Info</a>
      </div>
    </div>
    <div class="footer-bottom">© 2025 Aarzoo Electronics. All rights reserved.</div>
  </footer>

  <script>

    /* ════════════════════════════════════════
       1. READ ORDER FROM LOCALSTORAGE
    ════════════════════════════════════════ */
    var order = null;
    try {
      var raw = localStorage.getItem('aarzoo-last-order');
      if (raw) order = JSON.parse(raw);
    } catch(e) { order = null; }

    var content = document.getElementById('page-content');

    if (!order) {
      /* ── No order saved ── */
      content.innerHTML =
        '<div class="no-order">' +
          '<div style="font-size:64px;margin-bottom:16px">📦</div>' +
          '<h1>No Order Found</h1>' +
          '<p>You have not placed an order yet, or your session expired.</p>' +
          '<a href="products.html">Browse Products →</a>' +
        '</div>';
    } else {
      renderPage(order);
      startConfetti();
    }

    /* ════════════════════════════════════════
       2. RENDER CONFIRMATION PAGE
    ════════════════════════════════════════ */
    function renderPage(o) {

      /* Delivery date range */
      var d1 = new Date(); d1.setDate(d1.getDate() + 5);
      var d2 = new Date(); d2.setDate(d2.getDate() + 7);
      var fmtD = function(d, opts) { return d.toLocaleDateString('en-IN', opts); };
      var deliveryStr =
        fmtD(d1, { weekday:'long', day:'numeric', month:'long' }) +
        ' – ' +
        fmtD(d2, { day:'numeric', month:'long' });

      /* Payment chip label */
      var payMap = { cod:'💵 Cash on Delivery', upi:'📱 UPI / GPay', card:'💳 Debit / Credit Card' };
      var payLabel = payMap[o.paymentMethod] || '💳 Paid';

      /* Items */
      var itemsHTML = '';
      for (var i = 0; i < o.items.length; i++) {
        var it = o.items[i];
        itemsHTML +=
          '<div class="order-item">' +
            '<img src="' + it.image + '" alt="' + it.name + '" onerror="this.src=\'https://via.placeholder.com/56?text=?\'"/>' +
            '<div class="order-item-info">' +
              '<div class="order-item-name">' + it.name + '</div>' +
              '<div class="order-item-qty">Qty: ' + it.qty + '</div>' +
            '</div>' +
            '<div class="order-item-price">&#8377;' + (it.price * it.qty).toLocaleString('en-IN') + '</div>' +
          '</div>';
      }

      /* Tracking steps */
      var orderDate = new Date(o.date);
      var addDays = function(d, n) { var r = new Date(d); r.setDate(r.getDate() + n); return r; };
      var fmtDt = function(d) {
        return d.toLocaleDateString('en-IN', { day:'numeric', month:'short' }) +
               ' ' + d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
      };

      var steps = [
        { st:'done',   icon:'✓',  title:'Order Placed',     desc:'Your order has been received and confirmed.',         date: fmtDt(orderDate) },
        { st:'active', icon:'⚙️', title:'Processing',       desc:'We are preparing and packing your order.',            date: fmtDt(addDays(orderDate,1)) },
        { st:'',       icon:'📦', title:'Shipped',           desc:'Your order is on its way with our delivery partner.', date: fmtDt(addDays(orderDate,2)) + ' (est.)' },
        { st:'',       icon:'🚚', title:'Out for Delivery',  desc:'Your order is out for delivery in your area.',        date: fmtDt(addDays(orderDate,5)) + ' (est.)' },
        { st:'',       icon:'🏠', title:'Delivered',         desc:'Package delivered successfully.',                     date: fmtDt(addDays(orderDate,7)) + ' (est.)' },
      ];

      var trackHTML = '';
      for (var j = 0; j < steps.length; j++) {
        var s = steps[j];
        var lineHTML = j < steps.length - 1
          ? '<div class="track-line ' + (s.st === 'done' ? 'done' : '') + '"></div>'
          : '';
        var dotContent = s.st === 'done' ? '✓' : s.icon;
        trackHTML +=
          '<div class="track-step ' + s.st + '">' +
            '<div class="track-left">' +
              '<div class="track-dot ' + s.st + '">' + dotContent + '</div>' +
              lineHTML +
            '</div>' +
            '<div class="track-content">' +
              '<h4>' + s.title + '</h4>' +
              '<p>' + s.desc + '</p>' +
              '<div class="track-date">📅 ' + s.date + '</div>' +
            '</div>' +
          '</div>';
      }

      /* Shipping display */
      var shipDisplay = o.shipping === 0
        ? '<span style="color:#16a34a;font-weight:600">Free</span>'
        : '&#8377;' + o.shipping;

      /* Inject HTML */
      content.innerHTML =
        '<div class="confirm-wrap">' +

          /* Hero */
          '<div class="success-hero">' +
            '<div class="check-circle">✓</div>' +
            '<h1>Order Placed Successfully!</h1>' +
            '<p>Thank you for shopping at Aarzoo Electronics.<br>Your order is confirmed and being processed.</p>' +
            '<div class="order-id-badge">📦 Order ID: <strong>' + o.id + '</strong></div>' +
          '</div>' +

          /* Delivery banner */
          '<div class="delivery-banner">' +
            '<div class="label">⚡ Estimated Delivery</div>' +
            '<div class="dates">' + deliveryStr + '</div>' +
            '<div class="sub">Free delivery across India 🇮🇳</div>' +
          '</div>' +

          /* Grid */
          '<div class="confirm-grid">' +

            /* LEFT */
            '<div class="left-col">' +

              /* Items card */
              '<div class="card">' +
                '<div class="card-head"><div class="card-head-icon">🛍️</div><h3>Your Order</h3></div>' +
                '<div class="card-body">' + itemsHTML + '</div>' +
              '</div>' +

              /* Tracking card */
              '<div class="card">' +
                '<div class="card-head"><div class="card-head-icon">📍</div><h3>Order Tracking</h3></div>' +
                '<div class="card-body">' + trackHTML + '</div>' +
              '</div>' +

            '</div>' +

            /* RIGHT */
            '<div class="right-col">' +

              /* Summary card */
              '<div class="card">' +
                '<div class="card-head"><div class="card-head-icon">🧾</div><h3>Order Summary</h3></div>' +
                '<div class="card-body">' +
                  '<div class="summary-row"><span>Subtotal</span><span>&#8377;' + o.subtotal.toLocaleString('en-IN') + '</span></div>' +
                  '<div class="summary-row"><span>Shipping</span><span>' + shipDisplay + '</span></div>' +
                  '<div class="summary-row total"><span>Total Paid</span><span>&#8377;' + o.total.toLocaleString('en-IN') + '</span></div>' +
                  '<div class="pay-chip">' + payLabel + '</div>' +
                '</div>' +
              '</div>' +

              /* Address card */
              '<div class="card">' +
                '<div class="card-head"><div class="card-head-icon">📍</div><h3>Delivery Address</h3></div>' +
                '<div class="card-body">' +
                  '<div class="address-box">' +
                    '<strong>' + o.customer.name + '</strong>' +
                    o.customer.address +
                    '<br><span style="display:block;margin-top:6px">📞 ' + o.customer.phone + '</span>' +
                  '</div>' +
                '</div>' +
              '</div>' +

              /* Buttons */
              '<a href="products.html" class="btn-primary">🛍️ Continue Shopping</a>' +
              '<button class="btn-outline" onclick="window.print()">🖨️ Print Receipt</button>' +

            '</div>' +
          '</div>' +

          /* Trust badges */
          '<div class="trust-row">' +
            '<div class="trust-badge">🔒 Secure Checkout</div>' +
            '<div class="trust-badge">🚚 Free Delivery</div>' +
            '<div class="trust-badge">✅ Genuine Products</div>' +
            '<div class="trust-badge">🔄 Easy Returns</div>' +
            '<div class="trust-badge">📞 24/7 Support</div>' +
          '</div>' +

        '</div>';
    }

    /* ════════════════════════════════════════
       3. CONFETTI
    ════════════════════════════════════════ */
    function startConfetti() {
      var canvas = document.getElementById('confetti-canvas');
      var ctx    = canvas.getContext('2d');
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      window.addEventListener('resize', function() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
      });

      var COLORS = ['#0071e3','#22c55e','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#f97316'];

      function Piece() { this.reset(true); }
      Piece.prototype.reset = function(init) {
        this.x       = Math.random() * canvas.width;
        this.y       = init ? Math.random() * -canvas.height : -20;
        this.w       = 6  + Math.random() * 8;
        this.h       = 4  + Math.random() * 6;
        this.color   = COLORS[Math.floor(Math.random() * COLORS.length)];
        this.vy      = 2  + Math.random() * 3.5;
        this.vx      = (Math.random() - 0.5) * 2;
        this.angle   = Math.random() * Math.PI * 2;
        this.spin    = (Math.random() - 0.5) * 0.18;
        this.opacity = 0.8 + Math.random() * 0.2;
        this.circle  = Math.random() > 0.5;
      };
      Piece.prototype.update = function() {
        this.y += this.vy; this.x += this.vx; this.angle += this.spin;
        if (this.y > canvas.height + 20) this.reset(false);
      };
      Piece.prototype.draw = function() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = this.color;
        if (this.circle) {
          ctx.beginPath(); ctx.arc(0, 0, this.w / 2, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
        }
        ctx.restore();
      };

      var pieces = [];
      for (var k = 0; k < 130; k++) pieces.push(new Piece());

      var frame = 0; var running = true;
      function animate() {
        if (!running) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(function(p) { p.update(); p.draw(); });
        frame++;
        if (frame > 220) {
          pieces.forEach(function(p) { p.opacity -= 0.008; });
          if (pieces[0].opacity <= 0) {
            running = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            return;
          }
        }
        requestAnimationFrame(animate);
      }
      animate();
    }

  </script>
</body>
