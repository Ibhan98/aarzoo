<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — Aarzoo Electronics</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --black: #080810;
      --dark: #0f0f1a;
      --card: #16162a;
      --border: #2a2a45;
      --blue: #4f6ef7;
      --blue-light: #7b93ff;
      --red: #ef4444;
      --white: #f0f0ff;
      --muted: #7070a0;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--black);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 50%, rgba(79,110,247,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 80% 30%, rgba(79,110,247,0.07) 0%, transparent 50%),
        var(--black);
    }
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(79,110,247,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79,110,247,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .login-wrap {
      position: relative; z-index: 10;
      width: 100%; max-width: 420px;
      padding: 20px;
    }
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 44px 40px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.6), 0 0 0 1px rgba(79,110,247,0.1);
      animation: fadeUp 0.5s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .login-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--blue), var(--blue-light));
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(79,110,247,0.35);
    }
    .login-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.7rem; font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }
    .login-sub { color: var(--muted); font-size: 0.88rem; margin-bottom: 32px; }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 0.8rem; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
    }
    .input-wrap { position: relative; }
    .input-wrap .icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      font-size: 1rem; pointer-events: none;
    }
    .form-group input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px 12px 42px;
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .form-group input:focus {
      border-color: var(--blue);
      background: rgba(79,110,247,0.06);
    }
    .form-group input::placeholder { color: var(--muted); }
    .toggle-pw {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 1rem; padding: 0;
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: var(--white); }
    .error-msg {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      margin-bottom: 18px;
      display: none;
      animation: fadeUp 0.2s ease both;
    }
    .error-msg.show { display: block; }
    .login-btn {
      width: 100%;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-family: 'Syne', sans-serif;
      font-weight: 700; font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(79,110,247,0.35);
      margin-top: 4px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .login-btn:hover { background: var(--blue-light); transform: translateY(-1px); box-shadow: 0 8px 28px rgba(79,110,247,0.45); }
    .login-btn.loading { opacity: 0.7; pointer-events: none; }
    .back-link {
      display: block; text-align: center; margin-top: 20px;
      color: var(--muted); font-size: 0.85rem; text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--white); }
    .credentials-hint {
      margin-top: 28px; padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 0.78rem; color: var(--muted); text-align: center; line-height: 1.7;
    }
    .credentials-hint code {
      background: rgba(79,110,247,0.1);
      color: var(--blue-light);
      padding: 1px 6px; border-radius: 4px;
      font-family: monospace; font-size: 0.85em;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="bg-grid"></div>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-icon">🛡️</div>
      <div class="login-title">Admin Portal</div>
      <div class="login-sub">Aarzoo Electronics — Restricted Access</div>
      <div class="error-msg" id="errorMsg">⚠️ Invalid username or password. Try again.</div>
      <div class="form-group">
        <label>Username</label>
        <div class="input-wrap">
          <span class="icon">👤</span>
          <input type="text" id="username" placeholder="Enter admin username" autocomplete="username" />
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <span class="icon">🔒</span>
          <input type="password" id="password" placeholder="Enter admin password" autocomplete="current-password" />
          <button class="toggle-pw" onclick="togglePw()" type="button" id="toggleBtn">👁️</button>
        </div>
      </div>
      <button class="login-btn" onclick="doLogin()" id="loginBtn">
        <span id="btnText">Sign In to Dashboard</span>
      </button>
      <a href="index.html" class="back-link">← Back to Store</a>
      <div class="credentials-hint">
        Username: <code>admin</code> &nbsp;|&nbsp; Password: <code>aarzoo@2025</code>
      </div>
    </div>
  </div>
  <script>
    const ADMIN_USER = 'admin';
    const ADMIN_PASS = 'aarzoo@2025';
    const SESSION_KEY = 'aarzoo-admin-auth';

    if (sessionStorage.getItem(SESSION_KEY) === 'true') {
      window.location.href = 'admin.html';
    }

    function togglePw() {
      const inp = document.getElementById('password');
      const btn = document.getElementById('toggleBtn');
      if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
      else { inp.type = 'password'; btn.textContent = '👁️'; }
    }

    function doLogin() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errorMsg');
      err.classList.remove('show');
      btn.classList.add('loading');
      document.getElementById('btnText').textContent = 'Signing in…';
      setTimeout(() => {
        if (u === ADMIN_USER && p === ADMIN_PASS) {
          sessionStorage.setItem(SESSION_KEY, 'true');
          sessionStorage.setItem('aarzoo-admin-user', u);
          window.location.href = 'admin.html';
        } else {
          btn.classList.remove('loading');
          document.getElementById('btnText').textContent = 'Sign In to Dashboard';
          err.classList.add('show');
          document.getElementById('password').value = '';
        }
      }, 800);
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
